[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "dependency-intelligence-ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "httpx"]
[tool.setuptools.packages.find]
where = ["src"]

